name: port-slices

# Linux slice verification, independent of dotnet-desktop.yml (Windows sln build).
# Each job builds its image and runs its verify to green. No step skirts
# failures (no curl -k, no `|| true`); every assertion exits nonzero on mismatch.
# MariaDB 10.11 runs as a job-local container with the exact vendor server.cnf
# (research doc linux-server-feasibility.md section 4.2): MyISAM default,
# sql_mode='', lower_case_table_names=1. Job-local `docker run` (not `services:`)
# is deliberate: service containers cannot mount the vendor my.cnf, so the exact
# config — including init-time lower_case_table_names=1 on a fresh datadir —
# is only achievable this way, and every line runs the same under Docker Desktop.
on:
  push:
    paths:
      - "port/**"
      - "docs/research/poc/**"
      - "db/skeema/**"
      - ".github/workflows/port-slices.yml"
  pull_request:
    paths:
      - "port/**"
      - "docs/research/poc/**"
      - "db/skeema/**"
      - ".github/workflows/port-slices.yml"
  workflow_dispatch:

jobs:
  od-api-linux:
    name: od-api-linux full VerifyApi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start vendor-configured MariaDB 10.11
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/odcnf"
          cat > "$RUNNER_TEMP/odcnf/od-vendor.cnf" <<'EOF'
          # Vendor server.cnf fidelity (linux-server-feasibility.md 4.2):
          # MyISAM default, sql_mode='', lower_case_table_names=1 on Linux.
          [mysqld]
          default-storage-engine=MyISAM
          max_allowed_packet=40M
          max_connections=3000
          port=3306
          sql_mode=""
          explicit_defaults_for_timestamp=1
          lower_case_table_names=1
          EOF
          docker network create ci-odnet
          docker run -d --name ci-od-mariadb --network ci-odnet \
            -e MARIADB_ROOT_PASSWORD=root \
            -e MARIADB_DATABASE=opendental \
            -v "$RUNNER_TEMP/odcnf/od-vendor.cnf:/etc/mysql/conf.d/od-vendor.cnf:ro" \
            mariadb:10.11
          for i in $(seq 1 60); do
            if docker exec ci-od-mariadb mariadb-admin ping -uroot -proot --silent 2>/dev/null; then
              echo "MariaDB ready after ~$((i * 2))s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "MariaDB never became ready"
              docker logs ci-od-mariadb
              exit 1
            fi
            sleep 2
          done

      - name: Assert vendor MariaDB config
        run: |
          set -euo pipefail
          row="$(docker exec ci-od-mariadb mariadb -uroot -proot -N -B -e "SELECT @@global.sql_mode, @@global.default_storage_engine, @@global.lower_case_table_names, @@global.max_allowed_packet, @@global.explicit_defaults_for_timestamp, VERSION();")"
          echo "$row"
          # awk -F'\t' (not read): sql_mode is empty, and read would swallow the leading tab.
          sql_mode="$(echo "$row" | awk -F'\t' '{print $1}')"
          engine="$(echo "$row" | awk -F'\t' '{print $2}')"
          lctn="$(echo "$row" | awk -F'\t' '{print $3}')"
          packet="$(echo "$row" | awk -F'\t' '{print $4}')"
          expl="$(echo "$row" | awk -F'\t' '{print $5}')"
          version="$(echo "$row" | awk -F'\t' '{print $6}')"
          [ "$sql_mode" = "" ] || { echo "FAIL: sql_mode='$sql_mode' (want empty)"; exit 1; }
          [ "$engine" = "MyISAM" ] || { echo "FAIL: default_storage_engine='$engine' (want MyISAM)"; exit 1; }
          [ "$lctn" = "1" ] || { echo "FAIL: lower_case_table_names='$lctn' (want 1)"; exit 1; }
          [ "$packet" = "41943040" ] || { echo "FAIL: max_allowed_packet='$packet' (want 41943040)"; exit 1; }
          { [ "$expl" = "1" ] || [ "$expl" = "ON" ]; } || { echo "FAIL: explicit_defaults_for_timestamp='$expl' (want 1/ON)"; exit 1; }
          echo "vendor config OK ($version)"

      - name: Apply slice schema + synthetic seed
        run: |
          set -euo pipefail
          for t in apikey preference patient appointment apisubscription payment paysplit; do
            docker exec -i ci-od-mariadb mariadb -uroot -proot opendental < "db/skeema/$t.sql"
          done
          docker exec -i ci-od-mariadb mariadb -uroot -proot opendental < port/od-api-linux/seed.sql
          docker exec ci-od-mariadb mariadb -uroot -proot -N -B -e \
            "SELECT (SELECT COUNT(*) FROM apikey), (SELECT COUNT(*) FROM patient), (SELECT COUNT(*) FROM appointment), (SELECT COUNT(*) FROM payment);" \
            opendental

      - name: Build + start od-api-linux
        run: |
          set -euo pipefail
          docker build -t od-api-linux ./port/od-api-linux
          docker run -d --name ci-od-api --network ci-odnet -p 127.0.0.1:8080:8080 \
            -e OD_DB_HOST=ci-od-mariadb \
            -e OD_DB=opendental \
            -e OD_DB_USER=root \
            -e OD_DB_PASS=root \
            od-api-linux
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "od-api-linux ready after ~$((i * 2))s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "od-api-linux never became ready"
              docker logs ci-od-api
              exit 1
            fi
            sleep 2
          done

      - name: "Run VerifyApi (full gate: reads, events, write path)"
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/verifywork"
          cp -r port/od-api-linux/VerifyApi "$RUNNER_TEMP/verifywork"
          docker run --rm --network ci-odnet \
            -v "$RUNNER_TEMP/verifywork:/work:ro" \
            mcr.microsoft.com/dotnet/sdk:8.0 \
            bash -c "cd /tmp && cp -r /work verifywork && cd verifywork && dotnet run -- http://ci-od-api:8080"

  od-mt-spike:
    name: od-mt-spike scripted check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + start od-mt-spike
        run: |
          set -euo pipefail
          docker build -t od-mt-spike ./port/od-mt-spike
          docker run -d --name ci-od-mt -p 127.0.0.1:8080:8080 od-mt-spike
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "od-mt-spike ready after ~$((i * 2))s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "od-mt-spike never became ready"
              docker logs ci-od-mt
              exit 1
            fi
            sleep 2
          done

      - name: Run scripted SOAP check
        run: bash port/od-mt-spike/check.sh http://127.0.0.1:8080

  odcrypt-compat:
    name: odcrypt-compat vectors (187/187)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + run hermetic verify (exit code gates)
        run: |
          set -euo pipefail
          docker build -t odcrypt-verify ./docs/research/poc/odcrypt-compat
          docker run --rm odcrypt-verify

  od-linux-heartbeat:
    name: od-linux-heartbeat vs MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start vendor-configured MariaDB 10.11
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/odcnf"
          cat > "$RUNNER_TEMP/odcnf/od-vendor.cnf" <<'EOF'
          # Vendor server.cnf fidelity (linux-server-feasibility.md 4.2):
          # MyISAM default, sql_mode='', lower_case_table_names=1 on Linux.
          [mysqld]
          default-storage-engine=MyISAM
          max_allowed_packet=40M
          max_connections=3000
          port=3306
          sql_mode=""
          explicit_defaults_for_timestamp=1
          lower_case_table_names=1
          EOF
          docker network create ci-odnet
          docker run -d --name ci-od-mariadb --network ci-odnet \
            -e MARIADB_ROOT_PASSWORD=root \
            -e MARIADB_DATABASE=opendental \
            -v "$RUNNER_TEMP/odcnf/od-vendor.cnf:/etc/mysql/conf.d/od-vendor.cnf:ro" \
            mariadb:10.11
          for i in $(seq 1 60); do
            if docker exec ci-od-mariadb mariadb-admin ping -uroot -proot --silent 2>/dev/null; then
              echo "MariaDB ready after ~$((i * 2))s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "MariaDB never became ready"
              docker logs ci-od-mariadb
              exit 1
            fi
            sleep 2
          done

      - name: Assert vendor MariaDB config
        run: |
          set -euo pipefail
          row="$(docker exec ci-od-mariadb mariadb -uroot -proot -N -B -e "SELECT @@global.sql_mode, @@global.default_storage_engine, @@global.lower_case_table_names, @@global.max_allowed_packet, @@global.explicit_defaults_for_timestamp, VERSION();")"
          echo "$row"
          # awk -F'\t' (not read): sql_mode is empty, and read would swallow the leading tab.
          sql_mode="$(echo "$row" | awk -F'\t' '{print $1}')"
          engine="$(echo "$row" | awk -F'\t' '{print $2}')"
          lctn="$(echo "$row" | awk -F'\t' '{print $3}')"
          packet="$(echo "$row" | awk -F'\t' '{print $4}')"
          expl="$(echo "$row" | awk -F'\t' '{print $5}')"
          version="$(echo "$row" | awk -F'\t' '{print $6}')"
          [ "$sql_mode" = "" ] || { echo "FAIL: sql_mode='$sql_mode' (want empty)"; exit 1; }
          [ "$engine" = "MyISAM" ] || { echo "FAIL: default_storage_engine='$engine' (want MyISAM)"; exit 1; }
          [ "$lctn" = "1" ] || { echo "FAIL: lower_case_table_names='$lctn' (want 1)"; exit 1; }
          [ "$packet" = "41943040" ] || { echo "FAIL: max_allowed_packet='$packet' (want 41943040)"; exit 1; }
          { [ "$expl" = "1" ] || [ "$expl" = "ON" ]; } || { echo "FAIL: explicit_defaults_for_timestamp='$expl' (want 1/ON)"; exit 1; }
          echo "vendor config OK ($version)"

      - name: Apply heartbeat schema (preference/signalod/eservicesignal)
        run: |
          set -euo pipefail
          for t in preference signalod eservicesignal; do
            docker exec -i ci-od-mariadb mariadb -uroot -proot opendental < "db/skeema/$t.sql"
          done

      - name: Build + run heartbeat (POC_SUCCESS gates)
        run: |
          set -euo pipefail
          docker build -t od-linux-heartbeat ./docs/research/poc/od-linux-heartbeat
          docker run --rm --network ci-odnet \
            -e OD_DB_HOST=ci-od-mariadb \
            -e OD_DB=opendental \
            -e OD_DB_USER=root \
            -e OD_DB_PASS=root \
            od-linux-heartbeat | tee "$RUNNER_TEMP/heartbeat.log"
          grep -q "POC_SUCCESS" "$RUNNER_TEMP/heartbeat.log"
